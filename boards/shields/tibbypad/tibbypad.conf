#core
CONFIG_ZMK_EXT_POWER=y

# LED Strip Core
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

#underglow
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
#CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
#CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

#ZMK USB RGB Idle Bypass
CONFIG_ZMK_BT_IDLE_ONLY=y

#ZMK RGB Plus Custom Lighting
CONFIG_ZMK_RGB_PLUS=y
CONFIG_ZMK_RGB_PLUS_RIPPLE_MAX_RADIUS=400


#ZMKSTUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#sleep/idle
CONFIG_ZMK_IDLE_TIMEOUT=600000
#CONFIG_ZMK_SLEEP=y
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

#extras
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y